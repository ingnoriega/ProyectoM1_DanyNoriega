<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colorfly Palette Generator</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Colorfly Studio</h1>
      <p>Generador de paletas de colores</p>
    </header>

    <main>
      <h2>Crea tu paleta de colores</h2>
      <p>Descubre nuevas combinaciones de colores.</p>

      <div class="controles">
        <label for="cantidad">Cantidad de colores:</label>
        <select id="cantidad">
          <option value="6">6 colores</option>
          <option value="8">8 colores</option>
          <option value="9">9 colores</option>
        </select>

        <label for="formato">Formato:</label>
        <select id="formato">
          <option value="HEX">HEX</option>
          <option value="HSL">HSL</option>
        </select>

        <button id="generar" type="button">Generar paleta</button>
      </div>

      <section id="paleta" aria-label="Paleta de colores">
        <!-- JavaScript creará las tarjetas -->
      </section>
    </main>
  </body>
</html>
